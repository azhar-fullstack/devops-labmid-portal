<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Lab Mid — CI Status</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --ok: #3dd68c;
      --fail: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-weight: 650; letter-spacing: -0.02em; }
    .muted { color: var(--muted); }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.85rem;
    }
    .badge.passed { background: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
    .badge.failed { background: color-mix(in srgb, var(--fail) 25%, transparent); color: var(--fail); }
    .badge.unknown { background: #334155; color: #cbd5e1; }
    .panel {
      background: var(--panel);
      border: 1px solid #2a3648;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-top: 1.25rem;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
    th, td { text-align: left; padding: 0.55rem 0.35rem; border-bottom: 1px solid #2a3648; font-size: 0.95rem; }
    th { color: var(--muted); font-weight: 500; }
    code { font-size: 0.85rem; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <p class="muted">CSC418 · FA23-BAI-039 · Azhar Mehmood</p>
    <h1>Assignment Submission Portal — CI Status</h1>
    <p class="muted">Latest automated test report from GitHub Actions.</p>
    <div class="panel">
      <p>Overall: <span id="status" class="badge unknown">loading</span></p>
      <p class="muted">Passed <span id="passed">–</span> / Failed <span id="failed">–</span> / Total <span id="total">–</span></p>
      <p class="muted">Run <code id="run">–</code> · <span id="ts">–</span></p>
      <table>
        <thead>
          <tr><th>Test</th><th>Result</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script>
    async function load() {
      try {
        const res = await fetch("./test-report.json", { cache: "no-store" });
        const data = await res.json();
        const status = (data.overall_status || "unknown").toLowerCase();
        const el = document.getElementById("status");
        el.textContent = status;
        el.className = "badge " + (status === "passed" || status === "failed" ? status : "unknown");
        document.getElementById("passed").textContent = data.passed ?? "–";
        document.getElementById("failed").textContent = data.failed ?? "–";
        document.getElementById("total").textContent = data.total ?? "–";
        document.getElementById("run").textContent = data.pipeline_run_id || "–";
        document.getElementById("ts").textContent = data.execution_timestamp || "–";
        const rows = document.getElementById("rows");
        rows.innerHTML = "";
        (data.tests || []).forEach((t) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td><code>${t.name || ""}</code></td><td>${t.result || ""}</td>`;
          rows.appendChild(tr);
        });
      } catch (e) {
        document.getElementById("status").textContent = "unavailable";
      }
    }
    load();
  </script>
</body>
</html>
